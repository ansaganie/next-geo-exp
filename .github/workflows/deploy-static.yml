name: Deploy Static Site

on:
  push:
    branches:
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_PHONE_MAIN: ${{ secrets.NEXT_PUBLIC_PHONE_MAIN }}
      NEXT_PUBLIC_PHONE_DISPLAY: ${{ secrets.NEXT_PUBLIC_PHONE_DISPLAY }}
      NEXT_PUBLIC_EMAIL: ${{ secrets.NEXT_PUBLIC_EMAIL }}
      NEXT_PUBLIC_INSTAGRAM_URL: ${{ secrets.NEXT_PUBLIC_INSTAGRAM_URL }}
      NEXT_PUBLIC_WHATSAPP_BASE: ${{ secrets.NEXT_PUBLIC_WHATSAPP_BASE }}
      NEXT_PUBLIC_MAP_IFRAME_SRC: ${{ secrets.NEXT_PUBLIC_MAP_IFRAME_SRC }}
      NEXT_PUBLIC_LEAD_ENDPOINT: /api/lead.php

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build static site
        run: bun run build

      - name: Inject Telegram secrets into PHP endpoint
        env:
          TELEGRAM_BOT_CONNECTION_STRING: ${{ secrets.TELEGRAM_BOT_CONNECTION_STRING }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          BOT_ESCAPED=$(printf '%s' "$TELEGRAM_BOT_CONNECTION_STRING" | sed -e 's/[\/&]/\\&/g')
          CHAT_ESCAPED=$(printf '%s' "$TELEGRAM_CHAT_ID" | sed -e 's/[\/&]/\\&/g')
          sed -i "s/__TELEGRAM_BOT_CONNECTION_STRING__/$BOT_ESCAPED/g" out/api/lead.php
          sed -i "s/__TELEGRAM_CHAT_ID__/$CHAT_ESCAPED/g" out/api/lead.php

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: out/

      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.PLESK_FTP_SERVER }}
          username: ${{ secrets.PLESK_FTP_USERNAME }}
          password: ${{ secrets.PLESK_FTP_PASSWORD }}
          protocol: ftps
          local-dir: out/
          server-dir: /httpdocs/
          dangerous-clean-slate: false
