name: Deploy to Plesk

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build
        env:
          NEXT_PUBLIC_PHONE_MAIN: ${{ secrets.NEXT_PUBLIC_PHONE_MAIN }}
          NEXT_PUBLIC_PHONE_DISPLAY: ${{ secrets.NEXT_PUBLIC_PHONE_DISPLAY }}
          NEXT_PUBLIC_WHATSAPP_BASE: ${{ secrets.NEXT_PUBLIC_WHATSAPP_BASE }}
          NEXT_PUBLIC_INSTAGRAM_URL: ${{ secrets.NEXT_PUBLIC_INSTAGRAM_URL }}
          NEXT_PUBLIC_EMAIL: ${{ secrets.NEXT_PUBLIC_EMAIL }}
          NEXT_PUBLIC_MAP_IFRAME_SRC: ${{ secrets.NEXT_PUBLIC_MAP_IFRAME_SRC }}

      - name: Copy static assets into standalone bundle
        run: |
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          cp .next/standalone/server.js .next/standalone/app.js

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: standalone-${{ github.sha }}
          path: .next/standalone/
          retention-days: 14

      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.PLESK_FTP_SERVER }}
          port: ${{ secrets.PLESK_FTP_PORT }}
          username: ${{ secrets.PLESK_FTP_USERNAME }}
          password: ${{ secrets.PLESK_FTP_PASSWORD }}
          protocol: ftps
          local-dir: .next/standalone/
          server-dir: /httpdocs/
          dangerous-clean-slate: false
